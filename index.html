<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>3D Heart</title>
<style>
body{margin:0;overflow:hidden;background:black;}
</style>
</head>
<body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x000000);
const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,0.1,100);
camera.position.z=5;
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);

function heartPoints(count=15000){
const pts=[];
let tries=0;
while(pts.length<count&&tries<count*60){
tries++;
const x=THREE.MathUtils.randFloat(-1.6,1.6);
const y=THREE.MathUtils.randFloat(-1.6,1.6);
const z=THREE.MathUtils.randFloat(-1.6,1.6);
const f=Math.pow(x*x+2.25*y*y+z*z-1,3)-x*x*Math.pow(z,3)-(9/80)*y*y*Math.pow(z,3);
if(Math.abs(f)<0.03)pts.push(x,y,z);
}
const geo=new THREE.BufferGeometry();
geo.setAttribute("position",new THREE.Float32BufferAttribute(pts,3));
return geo;
}

const geometry=heartPoints();
const material=new THREE.PointsMaterial({
size:0.02,
color:0xff3366,
transparent:true,
opacity:0.9,
depthWrite:false
});
const points=new THREE.Points(geometry,material);
scene.add(points);

let t=0;
function animate(){
requestAnimationFrame(animate);
t+=0.02;
points.rotation.y+=0.01;
points.rotation.x=0.2+0.05*Math.sin(t);
renderer.render(scene,camera);
}
animate();

addEventListener("resize",()=>{
camera.aspect=innerWidth/innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
